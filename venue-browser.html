encedirect.com/science/article/pii/S1361841524001828", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "DeeperHistReg", "description": "robust framework for multi-stain WSI registration", "venue": "arXiv", "year": 2024, "kind": "Preprint / other", "category": "Pathology Image Registration and Spatial Alignment", "paper_url": "https://arxiv.org/abs/2404.14434", "pdf_url": "https://arxiv.org/pdf/2404.14434", "venue_url": "", "status": "legacy_readme"}, {"title": "RegWSI", "description": "WSI registration with combined global and local alignment", "venue": "CMPB", "year": 2024, "kind": "Journal", "category": "Pathology Image Registration and Spatial Alignment", "paper_url": "https://dl.acm.org/doi/10.1016/j.cmpb.2024.108187", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "OpenSlide", "description": "standard library for reading WSI", "venue": "J Pathol Inform", "year": 2013, "kind": "Journal", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://pubmed.ncbi.nlm.nih.gov/24244884/", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "QuPath", "description": "open-source platform for digital pathology analysis", "venue": "Sci Rep", "year": 2017, "kind": "Journal", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://www.nature.com/articles/s41598-017-17204-5", "pdf_url": "https://www.nature.com/articles/s41598-017-17204-5.pdf", "venue_url": "", "status": "legacy_readme"}, {"title": "HistoQC", "description": "quality control toolbox for digital pathology cohorts", "venue": "JCO Clin Cancer Inform", "year": 2019, "kind": "Journal", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://pubmed.ncbi.nlm.nih.gov/30990737/", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "TIAToolbox", "description": "end-to-end toolbox for computational pathology", "venue": "Commun Med", "year": 2022, "kind": "Journal", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://www.nature.com/articles/s43856-022-00186-5", "pdf_url": "https://www.nature.com/articles/s43856-022-00186-5.pdf", "venue_url": "", "status": "legacy_readme"}, {"title": "PathML", "description": "pathology ML toolkit with reusable pipelines", "venue": "JAMIA", "year": 2022, "kind": "Journal", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://pubmed.ncbi.nlm.nih.gov/34880124/", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "histolab", "description": "Python toolkit for reproducible WSI preprocessing", "venue": "SoftwareX", "year": 2022, "kind": "Journal", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://www.sciencedirect.com/science/article/pii/S2352711022001558", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "Slideflow", "description": "deep learning framework for whole-slide images", "venue": "arXiv", "year": 2023, "kind": "Preprint / other", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://arxiv.org/abs/2304.04142", "pdf_url": "https://arxiv.org/pdf/2304.04142", "venue_url": "", "status": "legacy_readme"}, {"title": "TRIDENT", "description": "large-scale WSI processing and feature extraction toolkit", "venue": "arXiv", "year": 2025, "kind": "Preprint / other", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://arxiv.org/abs/2502.06750", "pdf_url": "https://arxiv.org/pdf/2502.06750", "venue_url": "", "status": "legacy_readme"}, {"title": "MIL-Lab", "description": "standardized MIL codebase with pretrained model weights", "venue": "arXiv", "year": 2025, "kind": "Preprint / other", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://arxiv.org/abs/2506.09022", "pdf_url": "https://arxiv.org/pdf/2506.09022", "venue_url": "", "status": "legacy_readme"}, {"title": "LazySlide", "description": "pathology analysis utilities with model zoo support", "venue": "bioRxiv", "year": 2025, "kind": "Preprint / other", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://www.biorxiv.org/content/10.1101/2025.05.28.656548v1", "pdf_url": "", "venue_url": "", "status": "legacy_readme"}, {"title": "PFM_Segmentation", "description": "pathology foundation model segmentation framework", "venue": "arXiv", "year": 2026, "kind": "Preprint / other", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://arxiv.org/abs/2602.03887", "pdf_url": "https://arxiv.org/pdf/2602.03887", "venue_url": "", "status": "legacy_readme"}, {"title": "AtlasPatch", "description": "scalable tissue detection and patch extraction", "venue": "arXiv", "year": 2026, "kind": "Preprint / other", "category": "Resources, Toolkits, and Open-Source Projects", "paper_url": "https://arxiv.org/abs/2602.03998", "pdf_url": "https://arxiv.org/pdf/2602.03998", "venue_url": "", "status": "legacy_readme"}]</script>
  <script>
    const papers = JSON.parse(document.getElementById('paper-data').textContent);
    const controls = Object.fromEntries(['q','kind','venue','year'].map(id => [id,document.getElementById(id)]));
    const results = document.getElementById('results');
    const count = document.getElementById('count');
    const labels = {Conference:'会议',Journal:'期刊',Workshop:'Workshop','Preprint / other':'预印本 / 其他'};
    function populate(select,values) {
      for (const value of values) { const option=document.createElement('option'); option.value=value; option.textContent=value; select.append(option); }
    }
    populate(controls.kind,[...new Set(papers.map(p=>p.kind))].map(x=>x).sort());
    for (const option of controls.kind.options) if (labels[option.value]) option.textContent=labels[option.value];
    populate(controls.venue,[...new Set(papers.map(p=>p.venue))].sort((a,b)=>a.localeCompare(b)));
    populate(controls.year,[...new Set(papers.map(p=>p.year).filter(Boolean))].sort((a,b)=>b-a));
    function tag(text,className='') { const span=document.createElement('span'); span.className='tag '+className; span.textContent=text; return span; }
    function link(text,url) { const a=document.createElement('a'); a.href=url; a.textContent=text; a.target='_blank'; a.rel='noopener noreferrer'; return a; }
    function card(p) {
      const a=document.createElement('article'),tags=document.createElement('div'); tags.className='tags';
      tags.append(tag(labels[p.kind]||p.kind),tag(p.venue),tag(p.year||'年份未注明','year'));
      a.append(tags);
      const h=document.createElement('h2'); h.textContent=p.title; a.append(h);
      if (p.status==='author_reported_acceptance_official_page_pending') { const n=document.createElement('div'); n.className='note'; n.textContent='作者公布录用；官方论文页待发布'; a.append(n); }
      const d=document.createElement('p'); d.textContent=p.description||'介绍待补充'; a.append(d);
      const links=document.createElement('div'); links.className='links';
      if (p.paper_url) links.append(link('论文',p.paper_url));
      if (p.pdf_url) links.append(link('PDF',p.pdf_url));
      if (p.venue_url) links.append(link(p.kind==='Journal'?'期刊':'会议',p.venue_url));
      a.append(links); return a;
    }
    function render() {
      const q=controls.q.value.trim().toLocaleLowerCase();
      const filtered=papers.filter(p=>(!controls.kind.value||p.kind===controls.kind.value)&&(!controls.venue.value||p.venue===controls.venue.value)&&(!controls.year.value||String(p.year)===controls.year.value)&&(!q||[p.title,p.description,p.category,p.venue].join(' ').toLocaleLowerCase().includes(q)));
      filtered.sort((a,b)=>b.year-a.year||a.venue.localeCompare(b.venue)||a.title.localeCompare(b.title));
      count.replaceChildren(); const strong=document.createElement('strong'); strong.textContent=filtered.length; count.append(strong,document.createTextNode(' / '+papers.length+' 条论文与资源'));
      results.replaceChildren();
      if (!filtered.length) { const n=document.createElement('div'); n.className='empty'; n.textContent='没有匹配条目，请调整筛选条件。'; results.append(n); return; }
      const fragment=document.createDocumentFragment(); for (const p of filtered) fragment.append(card(p)); results.append(fragment);
    }
    for (const control of Object.values(controls)) control.addEventListener('input',render);
    render();
  </script>
